name: Offline validation

'on':
  pull_request:
    branches: [feature/suvd-dent-backend-completion, 'dot/**']
  push:
    branches: [feature/suvd-dent-backend-completion]

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET and PostgreSQL helper (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.402'
      - name: Build and run isolated .NET tests
        shell: bash
        run: |
          if [[ -v NEXORA_PG_TEST_CONNECTION || -v PGPASSWORD ]]; then
            echo 'PostgreSQL opt-in variables must be absent in offline CI.' >&2
            exit 1
          fi
          dotnet build backend/NexoraDental.sln --configuration Release
          dotnet test backend/NexoraDental.sln --configuration Release --no-build \
            --filter 'Category!=PostgreSqlIntegration&Category!=PostgreSqlConcurrency'
      - name: Run offline PostgreSQL helper tests
        shell: pwsh
        run: |
          if ((Test-Path Env:NEXORA_PG_TEST_CONNECTION) -or (Test-Path Env:PGPASSWORD)) {
            throw 'PostgreSQL opt-in variables must be absent in offline CI.'
          }
          ./backend/scripts/tests/PostgreSqlAutomation.Tests.ps1

  flutter:
    name: Flutter (offline tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the pinned Flutter SDK
        shell: bash
        env:
          FLUTTER_REVISION: abaf9c523780a608bd46686fd5e53740a07077f8 # 3.47.7
        run: |
          sdk="$RUNNER_TEMP/flutter-sdk"
          git init "$sdk"
          git -C "$sdk" remote add origin https://github.com/flutter/flutter.git
          git -C "$sdk" fetch --depth=1 origin refs/tags/3.47.7:refs/tags/3.47.7
          git -C "$sdk" checkout --detach "$FLUTTER_REVISION"
          test "$(git -C "$sdk" rev-parse 'refs/tags/3.47.7^{commit}')" = "$FLUTTER_REVISION"
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - name: Analyze and test Flutter
        working-directory: mobile
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.402'
      - name: Run synthetic clinician Flutter-to-API HTTPS acceptance
        shell: bash
        run: |
          if [[ -v NEXORA_PG_TEST_CONNECTION || -v PGPASSWORD || -v SUVDDENT_FLUTTER_TOOL || -v SUVDDENT_E2E_FLUTTER ]]; then
            echo 'PostgreSQL credentials and Flutter loopback opt-in variables must be absent before each isolated test.' >&2
            exit 1
          fi
          SUVDDENT_FLUTTER_TOOL="$(command -v flutter)" dotnet test backend/DentalApi.IntegrationTests/DentalApi.IntegrationTests.csproj \
            --configuration Release --filter 'Category=ClinicalFlutterLoopback'
      - name: Run synthetic appointment Flutter-to-API loopback acceptance
        shell: bash
        run: |
          if [[ -v NEXORA_PG_TEST_CONNECTION || -v PGPASSWORD || -v SUVDDENT_FLUTTER_TOOL || -v SUVDDENT_E2E_FLUTTER ]]; then
            echo 'PostgreSQL credentials and Flutter loopback opt-in variables must be absent before each isolated test.' >&2
            exit 1
          fi
          SUVDDENT_E2E_FLUTTER="$(command -v flutter)" dotnet test backend/DentalApi.IntegrationTests/DentalApi.IntegrationTests.csproj \
            --configuration Release --filter 'Category=FlutterLoopback'

      - name: Build academic Web release
        working-directory: mobile
        shell: bash
        run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run -O2 -t lib/academic_main.dart
      - name: Run classroom API smoke with synthetic email and SMS
        shell: bash
        run: |
          if [[ -v NEXORA_PG_TEST_CONNECTION || -v PGPASSWORD ]]; then
            echo 'PostgreSQL opt-in variables must be absent for the classroom fixture.' >&2
            exit 1
          fi
          dotnet publish backend/DentalApi.SchoolFixture --configuration Release --output "$RUNNER_TEMP/academic-otp-api"
          python3 backend/scripts/AcademicRuntimeSmoke.py "$RUNNER_TEMP/academic-otp-api/DentalApi.SchoolFixture.dll"
